name: Build DevBuild
on:
    workflow_dispatch:
    schedule:
        # Tự động kiểm tra repo gốc mỗi ngày 1 lần lúc 00:00 UTC (07:00 sáng giờ VN)
        - cron: "0 0 * * *"
    push:
        branches:
            - main
        paths:
            - .github/workflows/build.yml
            - src/**
            - browser/**
            - scripts/build/**
            - package.json
            - pnpm-lock.yaml

env:
    FORCE_COLOR: true

permissions:
    contents: write

jobs:
    Build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Sync with upstream (Vendicated/Vencord)
              id: sync
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  BEFORE_HASH=$(git rev-parse HEAD)

                  git fetch https://github.com/Vendicated/Vencord.git main
                  git merge FETCH_HEAD --no-edit

                  AFTER_HASH=$(git rev-parse HEAD)

                  if [ "$BEFORE_HASH" != "$AFTER_HASH" ]; then
                      git push origin main
                      echo "updated=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "updated=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Setup pnpm
              if: github.event_name != 'schedule' || steps.sync.outputs.updated == 'true'
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Use Node.js
              if: github.event_name != 'schedule' || steps.sync.outputs.updated == 'true'
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              if: github.event_name != 'schedule' || steps.sync.outputs.updated == 'true'
              run: pnpm install --frozen-lockfile

            - name: Build web
              if: github.event_name != 'schedule' || steps.sync.outputs.updated == 'true'
              run: pnpm buildWebStandalone

            - name: Build
              if: github.event_name != 'schedule' || steps.sync.outputs.updated == 'true'
              run: pnpm build --standalone

            - name: Generate plugin list
              if: github.event_name != 'schedule' || steps.sync.outputs.updated == 'true'
              run: pnpm generatePluginJson dist/plugins.json dist/plugin-readmes.json

            - name: Clean up obsolete files
              if: github.event_name != 'schedule' || steps.sync.outputs.updated == 'true'
              run: |
                  rm -rf dist/*-unpacked dist/vendor Vencord.user.css vencordDesktopRenderer.css vencordDesktopRenderer.css.map

            - name: Get some values needed for the release
              if: github.event_name != 'schedule' || steps.sync.outputs.updated == 'true'
              id: release_values
              run: |
                  echo "release_tag=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

            - name: Upload DevBuild as release
              if: github.event_name != 'schedule' || steps.sync.outputs.updated == 'true'
              run: |
                  mapfile -t FILES < <(find dist -maxdepth 1 -type f)
                  if gh release view devbuild --repo "$GH_REPO" >/dev/null 2>&1; then
                      gh release upload devbuild --repo "$GH_REPO" --clobber "${FILES[@]}"
                      gh release edit devbuild --repo "$GH_REPO" --title "DevBuild $RELEASE_TAG"
                  else
                      gh release create devbuild "${FILES[@]}" \
                          --repo "$GH_REPO" \
                          --title "DevBuild $RELEASE_TAG" \
                          --notes "Custom DevBuild synced with Vendicated/Vencord"
                  fi
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ env.release_tag }}
